[build-system]
# The in-tree backend keeps this fixture installable with no package index, so the end-to-end
# install test is hermetic; extension packages a researcher writes use setuptools instead.
requires = []
build-backend = "backend"
backend-path = ["_build"]

[project]
name = "aes-bm25-plugin"
version = "1.1.0"
description = "BM25 few-shot retrieval and mean absolute error, registered from a separate install"
requires-python = ">=3.11"
dependencies = ["abaes-eval-fwk>=0.1"]

[project.entry-points."abaes_eval_fwk.plugins"]
aes_bm25 = "aes_bm25_plugin:PLUGIN"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aes-demo-plugin"
version = "0.2.0"
description = "Demonstration extension package for the adaptive MAS grader registry"
requires-python = ">=3.11"
dependencies = ["abaes-eval-fwk>=0.1"]

[project.entry-points."abaes_eval_fwk.plugins"]
demo_retriever = "aes_demo_plugin:PLUGIN"

[tool.setuptools.packages.find]
include = ["aes_demo_plugin*"]

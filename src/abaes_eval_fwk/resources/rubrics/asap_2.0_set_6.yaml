source_text: "What Is the\nElectoral College?\nby the Office of the Federal Register\nThe Electoral College is a process, not a place. The founding fathers established it in the\nConstitution as a compromise between election of the President by a vote in Congress and\nelection of the President by a popular vote of qualified citizens.\nThe Electoral College process consists of the selection of the electors, the meeting of the\nelectors where they vote for President and Vice President, and the counting of the electoral votes\nby Congress.\nThe Electoral College consists of 538 electors. A majority of 270 electoral votes is required\nto elect the President. Your state’s entitled allotment of electors equals the number of members in\nits Congressional delegation: one for each member in the House of Representatives plus two for\nyour Senators. . . .\nUnder the 23rd Amendment of the Constitution, the District of Columbia is allocated 3\nelectors and treated like a state for purposes of the Electoral College. For this reason, in the\nfollowing discussion, the word “state” also refers to the District of Columbia.\nEach candidate running for President in your state has his or her own group of electors. The\nelectors are generally chosen by the candidate’s political party, but state laws vary on how the\nelectors are selected and what their responsibilities are. . . .\nThe presidential election is held every four years on the Tuesday after the first Monday in\nNovember. You help choose your state’s electors when you vote for President because when you\nvote for your candidate you are actually voting for your candidate’s electors.\nMost states have a “winner-take-all” system that awards all electors to the winning\npresidential candidate. However, Maine and Nebraska each have a variation of “proportional representation.” . . .\nAfter the presidential election, your governor prepares a “Certificate of Ascertainment”\nlisting all of the candidates who ran for President in your state along with the names of their\nrespective electors. The Certificate of Ascertainment also declares the winning presidential\ncandidate in your state and shows which electors will represent your state at the meeting of the\nelectors in December of the election year. Your state’s Certificates of Ascertainments are sent to\nthe Congress and the National Archives as part of the official records of the presidential election.\nExcerpt from “What Is the Electoral College?” by\nthe Office of the Federal Register, from\nwww.archives.gov/federal-register/electoral\x02college/about.html. In the public domain.\n\nThe Indefensible\nElectoral College: Why even\nthe best-laid defenses of\nthe system are wrong\nby Bradford Plumer\nWhat have Richard Nixon, Jimmy Carter, Bob Dole, the U.S. Chamber of Commerce, and the\nAFL-CIO all, in their time, agreed on? Answer: Abolishing the electoral college! They’re not alone;\naccording to a Gallup poll in 2000, taken shortly after Al Gore—thanks to the quirks of the\nelectoral college—won the popular vote but lost the presidency, over 60 percent of voters would\nprefer a direct election to the kind we have now. This year voters can expect another close\nelection in which the popular vote winner could again lose the presidency. And yet, the electoral\ncollege still has its defenders. What gives? . . .\nWhat’s wrong with the electoral college\nUnder the electoral college system, voters vote not for the president, but for a slate of\nelectors, who in turn elect the president. If you lived in Texas, for instance, and wanted to vote\nfor [John] Kerry, you’d vote for a slate of 34 Democratic electors pledged to Kerry. On the off\x02chance that those electors won the statewide election, they would go to Congress and Kerry\nwould get 34 electoral votes. Who are the electors? They can be anyone not holding public office.\nWho picks the electors in the first place? It depends on the state. Sometimes state conventions,\nsometimes the state party’s central committee, sometimes the presidential candidates\nthemselves. Can voters control whom their electors vote for? Not always. Do voters sometimes\nget confused about the electors and vote for the wrong candidate? Sometimes.\nThe single best argument against the electoral college is what we might call the disaster\nfactor. The American people should consider themselves lucky that the 2000 fiasco was the\nbiggest election crisis in a century; the system allows for much worse. Consider that state\nlegislatures are technically responsible for picking electors, and that those electors could always\ndefy the will of the people. Back in 1960, segregationists in the Louisiana legislature nearly\nsucceeded in replacing the Democratic electors with new electors who would oppose John F.\nKennedy. (So that a popular vote for Kennedy would not have actually gone to Kennedy.) In the\nsame vein, “faithless” electors have occasionally refused to vote for their party’s candidate and\ncast a deciding vote for whomever they please. . . . Oh, and what if a state sends two slates of\nelectors to Congress? It happened in Hawaii in 1960. Luckily, Vice President Richard Nixon, who\nwas presiding over the Senate, validated only his opponent’s electors, but he made sure to do so\n“without establishing a precedent.” What if it happened again?\nPerhaps most worrying is the prospect of a tie in the electoral vote. In that case, the\nelection would be thrown to the House of Representatives, where state delegations vote on the\npresident. (The Senate would choose the vice-president.) Because each state casts only one vote,\nthe single representative from Wyoming, representing 500,000 voters, would have as much say\nas the 55 representatives from California, who represent 35 million voters. Given that many\nvoters vote one party for president and another for Congress, the House’s selection can hardly be\nexpected to reflect the will of the people. And if an electoral tie seems unlikely, consider this: In\n1968, a shift of just 41,971 votes would have deadlocked the election; In 1976, a tie would have\noccurred if a mere 5,559 voters in Ohio and 3,687 voters in Hawaii had voted the other way. The\nelection is only a few swing voters away from catastrophe.\nAt the most basic level, the electoral college is unfair to voters. Because of the winner-take\x02all system in each state, candidates don't spend time in states they know they have no chance of\nwinning, focusing only on the tight races in the “swing” states. During the 2000 campaign,\nseventeen states didn’t see the candidates at all, including Rhode Island and South Carolina, and\nvoters in 25 of the largest media markets didn’t get to see a single campaign ad. If anyone has a\ngood argument for putting the fate of the presidency in the hands of a few swing voters in Ohio,\nthey have yet to make it. . . .\nIt’s official: The electoral college is unfair, outdated, and irrational. The best arguments in\nfavor of it are mostly assertions without much basis in reality. And the arguments against direct\nelections are spurious at best. It’s hard to say this, but Bob Dole was right: Abolish the electoral\ncollege!\n  lost the presidency: In the 2000 U.S. presidential\nrace, Al Gore received more individual votes than\nGeorge W. Bush nationwide, but Bush won the\nelection, receiving 271 electoral votes to Gore’s\n266.\nJohn Kerry: Kerry ran for President against George\nW. Bush (43rd president of the United States),\nrepresenting the Democratic Party in 2004.\nsegregationists: people who favored separation\nbased on race\nExcerpt from “The Indefensible Electoral College:\nWhy even the best-laid defenses are wrong” from\nMother Jones by Bradford Plumer. Copyright ©\n2004 by Mother Jones and the Foundation for\nNational Progress. All Rights Reserved.\n\nIn Defense of the\nElectoral College: Five\nreasons to keep our\ndespised method of\nchoosing the President\nby Judge Richard A. Posner\nThe Electoral College is widely regarded as an anachronism, a non-democratic method of\nselecting a president that ought to be [overruled] by declaring the candidate who receives the\nmost popular votes the winner. The advocates of this position are correct in arguing that the\nElectoral College method is not democratic in a modern sense . . . it is the electors who elect the\npresident, not the people. When you vote for a presidential candidate you’re actually voting for a\nslate of electors.\nBut each party selects a slate of electors trusted to vote for the party’s nominee (and that\ntrust is rarely betrayed) . . . [; however,] it is entirely possible that the winner of the electoral\nvote will not win the national popular vote. Yet that has happened very rarely. It happened in\n2000, when Gore had more popular votes than Bush yet fewer electoral votes, but that was the\nfirst time since 1888.\nThere are five reasons for retaining the Electoral College despite its lack of democratic\npedigree; all are practical reasons, not liberal or conservative reasons.\n1) Certainty of Outcome\nA dispute over the outcome of an Electoral College vote is possible—it happened in 2000\n—but it’s less likely than a dispute over the popular vote. The reason is that the winning\ncandidate’s share of the Electoral College invariably exceeds his share of the popular vote. In\n[2012’s] election, for example, Obama received 61.7 percent of the electoral vote compared to\nonly 51.3 percent of the popular votes cast for him and Romney. . . . Because almost all states\naward electoral votes on a winner-take-all basis, even a very slight plurality in a state creates a\nlandslide electoral-vote victory in that state. A tie in the nationwide electoral vote is possible\nbecause the total number of votes—538—is an even number, but it is highly unlikely. . . .\n2) Everyone’s President\nThe Electoral College requires a presidential candidate to have trans-regional appeal. No\nregion (South, Northeast, etc.) has enough electoral votes to elect a president. So a solid regional\nfavorite, such as Romney was in the South, has no incentive to campaign heavily in those states,\nfor he gains no electoral votes by increasing his plurality in states that he knows he will win. This\nis a desirable result because a candidate with only regional appeal is unlikely to be a successful\npresident. The residents of the other regions are likely to feel disenfranchised—to feel that their\nvotes do not count, that the new president will have no regard for their interests, that he really\nisn’t their president.\n3) Swing States\nThe winner-take-all method of awarding electoral votes induces the candidates—as we saw\nin [2012’s] election—to focus their campaign efforts on the toss-up states . . . . Voters in toss-up\nstates are more likely to pay close attention to the campaign—to really listen to the competing\ncandidates—knowing that they are going to decide the election. They are likely to be the most\nthoughtful voters, on average (and for the further reason that they will have received the most\ninformation and attention from the candidates), and the most thoughtful voters should be the\nones to decide the election.\n4) Big States\nThe Electoral College restores some of the weight in the political balance that large states\n(by population) lose by virtue of the mal-apportionment of the Senate decreed in the\nConstitution. . . . The popular vote was very close in Florida [in 2012]; nevertheless Obama, who\nwon that vote, got 29 electoral votes. A victory by the same margin in Wyoming would net the\nwinner only 3 electoral votes. So, other things being equal, a large state gets more attention from\npresidential candidates in a campaign than a small state does. . . .\n5) Avoid Run-Off Elections\nThe Electoral College avoids the problem of elections in which no candidate receives a\nmajority of the votes cast. For example, Nixon in 1968 and Clinton in 1992 both had only a 43\npercent plurality of the popular votes, while winning a majority in the Electoral College (301 and\n370 electoral votes, respectively). There is pressure for run-off elections when no candidate wins\na majority of the votes cast; that pressure, which would greatly complicate the presidential\nelection process, is reduced by the Electoral College, which invariably produces a clear winner. . . .\nIt can be argued that the Electoral College method of selecting the president may turn off\npotential voters for a candidate who has no hope of carrying their state—Democrats in Texas, for\nexample, or Republicans in California. Knowing their vote will have no effect, they have less\nincentive to pay attention to the campaign than they would have if the president were picked by\npopular vote . . . . But of course no voter’s vote swings a national election, and in spite of that,\nabout one-half the eligible American population did vote in [2012’s] election. Voters in\npresidential elections are people who want to express a political preference rather than people\nwho think that a single vote may decide an election. . . .\nanachronism: a person or a thing that seems to\nbelong to the past and not to fit in the present\npedigree: the origin and history of something,\nespecially when it is good or impressive\nliberal or conservative: political philosophies\ncommonly seen as opposite each other\nObama: Barack Obama, 44th president of the\nUnited States\nRomney: Mitt Romney, the Republican nominee for\nPresident in 2012\nplurality: when a candidate receives more votes\nthan other candidates while not receiving a clear\nmajority of votes\nExcerpt from “In Defense of the Electoral College:\nFive reasons to keep our despised method of\nchoosing the President” from Slate Magazine by\nJudge Richard A. Posner. Copyright © 2012."
prompt: Write a letter to your state senator in which you argue in favor of keeping the Electoral College or changing to election by popular vote for the president of the United States. Use the information from the texts in your essay. Manage your time carefully so that you can read the passages; plan your response; write your response; and revise and edit your response. Be sure to include a claim; address counterclaims; use evidence from multiple sources; and avoid overly relying on one source. Your response should be in the form of a multiparagraph essay. Write your response in the space provided.

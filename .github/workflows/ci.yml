name: Framework checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python -m build

  integration:
    # Runs the framework end to end, so only for pull requests into main, pushes to main, and
    # manual runs, and on one Python version.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The playground's semantic and hybrid experiments need the dense extra; the CPU index keeps
      # torch from pulling CUDA wheels.
      - run: >-
          python -m pip install '.[dev,dense]'
          --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -m integration
      - run: python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          abaes-eval-fwk init installed-demo
          abaes-eval-fwk run installed-demo/benchmark.yaml

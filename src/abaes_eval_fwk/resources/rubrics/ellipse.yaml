# Source: ELLIPSE Corpus — https://github.com/scrosseye/ELLIPSE-Corpus
assignment_type: English Language Learner writing sample
score_ranges:
  overall: [0, 5]
  per_criterion: [0, 5]
criteria_aggregation: mean
source_dependent: false
prompt: |
  Students were asked to write an argumentative, persuasive, or personal essay on a topic of their choice. Essays come from English Language Learner students at various proficiency levels. There is no single fixed prompt — evaluate each essay on the six analytic dimensions below using the official ELLIPSE (English Language Learner Insight, Proficiency and Skills Evaluation) proficiency scoring rubric.
criteria:
  cohesion:
    score_levels:
    - score: 5
      guideline: Text organization consistently well controlled using a variety of effective linguistic features such as reference and transitional words and phrases to connect ideas across sentences and paragraphs; appropriate overlap of ideas.
    - score: 4
      guideline: Organization generally well controlled; a range of cohesive devices used appropriately such as reference and transitional words and phrases to connect ideas; generally appropriate overlap of ideas.
    - score: 3
      guideline: Organization generally controlled; cohesive devices used but limited in type; Some repetitive, mechanical, or faulty use of cohesion use within and/or between sentences and paragraphs.
    - score: 2
      guideline: Organization only partially developed with a lack of logical sequencing of ideas; some basic cohesive devices used but with inaccuracy or repetition.
    - score: 1
      guideline: No clear control of organization; cohesive devices not present or unsuccessfully used; presentation of ideas unclear.
  syntax:
    score_levels:
    - score: 5
      guideline: Flexible and effective use of a full range of syntactic structures including simple, compound, and complex sentences; There may be rare minor and negligible errors in sentence formation.
    - score: 4
      guideline: Appropriate use of a variety of syntactic structures, such as simple, compound, and complex sentences; occasional errors or inappropriateness in sentence formation.
    - score: 3
      guideline: Simple, compound, and complex syntactic structures present although the range may be limited; some apparent errors in sentence formation, especially in more complex sentences.
    - score: 2
      guideline: Some sentence variation used; many sentence structure problems.
    - score: 1
      guideline: Pervasive and basic errors in sentence structure and word order that cause confusion; basic sentences errors common.
  vocabulary:
    score_levels:
    - score: 5
      guideline: Wide range of vocabulary flexibly and effectively used to convey precise meanings; skillful use of topic-related terms and less common words; rare negligible inaccuracies in word use.
    - score: 4
      guideline: Sufficient range of vocabulary to allow flexibility and precision; appropriate use of topic-related terms and less common lexical items.
    - score: 3
      guideline: Minimally adequate range of vocabulary for the topic; no precise use of subtle word meanings; topic related terms only used occasionally; attempts to use less common vocabulary but with some inaccuracy.
    - score: 2
      guideline: Narrow range of vocabulary to convey basic and elementary meaning; topic related terms used inappropriately; errors in word formation and word choice that may distort meanings.
    - score: 1
      guideline: Limited vocabulary often inappropriately used; limited control of word choice and word forms; little attempt to use topic-related terms.
  phraseology:
    score_levels:
    - score: 5
      guideline: Flexible and effective use of a variety of phrases, such as idioms, collocations, and lexical bundles, to convey precise and subtle meanings; rare minor inaccuracies that are negligible.
    - score: 4
      guideline: Appropriate use of a variety of phrases, such as idioms, collocations, and lexical bundles; occasional inaccuracies and colloquialisms.
    - score: 3
      guideline: Evident use of phrases such as idioms, collocations, and lexical bundles but without much variety; some noticeable repetitions and misuses.
    - score: 2
      guideline: Narrow range of phrases, such as collocations and lexical bundles, used to convey basic and elementary meaning; many repetitions and/or misuses of phrases.
    - score: 1
      guideline: Memorized chunks of language, or simple phrasal patterns predominate; many repetitions and misuses of phrases.
  grammar:
    score_levels:
    - score: 5
      guideline: Command of grammar and usage with few or no errors.
    - score: 4
      guideline: Minimal errors in grammar and usage.
    - score: 3
      guideline: Some errors in grammar and usage.
    - score: 2
      guideline: Many errors in grammar and usage.
    - score: 1
      guideline: Errors in grammar and usage throughout.
  conventions:
    score_levels:
    - score: 5
      guideline: Consistent use of appropriate conventions to convey meaning; spelling, capitalization, and punctuation errors nonexistent or negligible.
    - score: 4
      guideline: Generally consistent use of appropriate conventions to convey meaning; spelling, capitalization, and punctuation errors few and not distracting.
    - score: 3
      guideline: Developing use of conventions to convey meaning; errors in spelling, capitalization, and punctuation that are sometimes distracting.
    - score: 2
      guideline: Variable use of conventions; spelling, capitalization, and punctuation errors frequent and distracting.
    - score: 1
      guideline: Minimal use of conventions; spelling, capitalization, and punctuation errors throughout.
rubric_guidelines: |-
  English Proficiency Scoring Rubric for English Language Learners (official ELLIPSE rubric, Holistic/Overall column). Holistic overall score, 1 (lowest) – 5 (highest); the six analytic dimensions above (cohesion, syntax, vocabulary, phraseology, grammar, conventions) are scored on the same 1–5 scale. A score of 0 may appear in the source data for off-topic/unscorable responses, outside the formal 1–5 proficiency scale described below.

  Score 5: Native-like facility in the use of language with syntactic variety, Appropriate word choice and phrases; well-controlled text organization; precise use of grammar and conventions; rare language inaccuracies that do not impede communication.

  Score 4: Facility in the use of language with syntactic variety and range of words and phrases; controlled organization; accuracy in grammar and conventions; occasional language inaccuracies that rarely impede communication.

  Score 3: Facility limited to the use of common structures and generic vocabulary; organization generally controlled although connection sometimes absent or unsuccessful; errors in grammar and syntax and usage. Communication is impeded by language inaccuracies in some cases.

  Score 2: Inconsistent facility in sentence formation, word choice, and mechanics; organization partially developed but may be missing or unsuccessful. Communication impeded in many instances by language inaccuracies.

  Score 1: A limited range of familiar words or phrases loosely strung together; frequent errors in grammar (including syntax) and usage. Communication impeded in most cases by language inaccuracies.
